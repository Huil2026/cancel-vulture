name: Vulture Watch expedited price alert

on:
  workflow_dispatch:
    inputs:
      company:
        description: Company or subscription
        required: true
      official_url:
        description: Official announcement, pricing or support URL
        required: true
      effective_date:
        description: Effective date (YYYY-MM-DD)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  price-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate and draft alert
        run: npm run editorial:alert
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          ALERT_COMPANY: ${{ inputs.company }}
          ALERT_OFFICIAL_URL: ${{ inputs.official_url }}
          ALERT_EFFECTIVE_DATE: ${{ inputs.effective_date }}
      - run: npm run editorial:validate
      - run: npm test
      - name: Open expedited manual-review PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- content/vulture-watch app/vulture-watch/generated.ts; then
            echo "No alert was generated. Configure OPENAI_API_KEY or use the manual article workflow."
            exit 0
          fi
          branch="automation/vulture-alert-${GITHUB_RUN_ID}"
          git config user.name "cancel-vulture-editorial-bot"
          git config user.email "editorial-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/vulture-watch app/vulture-watch/generated.ts
          git commit -m "Add expedited Vulture Watch price alert"
          git push origin "$branch"
          gh pr create --draft --base "${GITHUB_REF_NAME}" --head "$branch" --title "Price alert: ${{ inputs.company }} effective ${{ inputs.effective_date }}" --body "Expedited price alert backed by the supplied official source. Verify the effective date and every price claim before marking this draft ready for review."

